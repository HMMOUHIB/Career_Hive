<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CareerHive</title>
    <meta name="description" content="CareerHive — formations, skills and promotions in one workspace." />
    <meta name="theme-color" content="#0b0809" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe9" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the saved theme applies before the first paint, so a light-theme user never sees a dark flash -->
    <script>
      try { if ((localStorage.getItem('ch_theme_v4') ?? localStorage.getItem('ch_theme_v3')) === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Onest for the interface, Bricolage Grotesque for headings and figures, Shippori Mincho for the section marks only -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E9%81%93%E6%98%87%E5%BF%97%E5%8F%8B&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
