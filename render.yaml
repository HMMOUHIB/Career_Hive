# Render Blueprint for the CareerHive API (careerhive-backend), on Render's free plan.
# Render → New → Blueprint → this repository. It asks for the values marked `sync: false`
# (the MySQL connection from Aiven, and the Gmail account that sends confirmation emails).
# The build runs `npm run db:setup`, which creates the database and tables if missing and never deletes data.
services:
  - type: web
    name: careerhive-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: careerhive-backend
    buildCommand: npm install && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # the UI, allowed by CORS; sign-in links return here
      - key: FRONTEND_URL
        value: https://career-hive-ebon.vercel.app
      # the workspace owner: this email becomes a manager on sign-up
      - key: STAFF_EMAILS
        value: hamzaouimoh54@gmail.com
      - key: APP_TIMEZONE
        value: Africa/Tunis
      # MySQL on Aiven: copy these from the service's "Connection information"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: careerhive
      - key: DB_SSL
        value: "true"
      # Aiven signs its certificates with its own CA
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # confirmation and reset emails (Gmail: an App password, not your normal password)
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
